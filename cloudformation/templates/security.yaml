AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated public and private EC2 security groups
Parameters:
  NamePrefix:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  AdminCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
Resources:
  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Administrator SSH to bastion
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: Administrator SSH
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-public-ec2'
  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion SSH to private instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref PublicSecurityGroup
          Description: Bastion SSH
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-private-ec2'
Outputs:
  PublicSecurityGroupId:
    Value: !Ref PublicSecurityGroup
  PrivateSecurityGroupId:
    Value: !Ref PrivateSecurityGroup
