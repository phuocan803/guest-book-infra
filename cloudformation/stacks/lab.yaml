AWSTemplateFormatVersion: '2010-09-09'
Description: Lab 1 modular infrastructure parent stack
Parameters:
  NamePrefix:
    Type: String
    Default: lab-cfn
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.20.2.0/24
  AdminCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../templates/network.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        AvailabilityZone: !Ref AvailabilityZone
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
  Security:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../templates/security.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        VpcId: !GetAtt Network.Outputs.VpcId
        AdminCidr: !Ref AdminCidr
  Compute:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../templates/compute.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        AmiId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        PublicSubnetId: !GetAtt Network.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt Network.Outputs.PrivateSubnetId
        PublicSecurityGroupId: !GetAtt Security.Outputs.PublicSecurityGroupId
        PrivateSecurityGroupId: !GetAtt Security.Outputs.PrivateSecurityGroupId
Outputs:
  VpcId:
    Value: !GetAtt Network.Outputs.VpcId
  PublicSubnetId:
    Value: !GetAtt Network.Outputs.PublicSubnetId
  PrivateSubnetId:
    Value: !GetAtt Network.Outputs.PrivateSubnetId
  InternetGatewayId:
    Value: !GetAtt Network.Outputs.InternetGatewayId
  NatGatewayId:
    Value: !GetAtt Network.Outputs.NatGatewayId
  NatPublicIp:
    Value: !GetAtt Network.Outputs.NatPublicIp
  PublicRouteTableId:
    Value: !GetAtt Network.Outputs.PublicRouteTableId
  PrivateRouteTableId:
    Value: !GetAtt Network.Outputs.PrivateRouteTableId
  DefaultSecurityGroupId:
    Value: !GetAtt Network.Outputs.DefaultSecurityGroupId
  PublicSecurityGroupId:
    Value: !GetAtt Security.Outputs.PublicSecurityGroupId
  PrivateSecurityGroupId:
    Value: !GetAtt Security.Outputs.PrivateSecurityGroupId
  PublicInstanceId:
    Value: !GetAtt Compute.Outputs.PublicInstanceId
  PrivateInstanceId:
    Value: !GetAtt Compute.Outputs.PrivateInstanceId
  PublicIp:
    Value: !GetAtt Compute.Outputs.PublicIp
  PrivateIp:
    Value: !GetAtt Compute.Outputs.PrivateIp
